<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Remplacé par flutter build web --base-href -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mathou : des mini-jeux de maths du CP au lycée. Gagne des pièces et construis ton village !">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Mode « app » quand on l'ajoute à l'écran d'accueil (iPhone et Android) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mathou">
  <meta name="theme-color" content="#16355F">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Mathou</title>

  <style>
    html, body { margin: 0; height: 100%; background: #16355F; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 35%, #2A5C96, #16355F);
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: white;
      transition: opacity .4s;
    }
    #splash img { width: 140px; height: 140px; border-radius: 32px;
      box-shadow: 0 8px 24px rgba(0,0,0,.25); animation: bounce 1.2s infinite ease-in-out; }
    #splash h1 { margin: 22px 0 0; font-size: 42px; font-weight: 900; letter-spacing: 1px; }
    #splash .smile { width: 96px; height: 14px; border-bottom: 6px solid #FF8C38; border-radius: 0 0 60px 60px; margin-bottom: 10px; }
    #splash p { margin: 0; font-size: 16px; opacity: .9; }
    @keyframes bounce { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-14px) } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-512.png" alt="Mathou">
    <h1>Mathou</h1>
    <div class="smile"></div>
    <p>Chargement de l'aventure…</p>
  </div>
  <script>
    // Retire l'écran de démarrage dès que l'app Flutter est affichée.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
