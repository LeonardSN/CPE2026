name: mathou
description: "Mathou - apprendre les maths en s'amusant (MVP CPE 2026)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/

  # Polices de la charte graphique (licence SIL Open Font, voir assets/fonts)
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-400.ttf
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800
        - asset: assets/fonts/Nunito-900.ttf
          weight: 900
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-400.ttf
        - asset: assets/fonts/Quicksand-500.ttf
          weight: 500
        - asset: assets/fonts/Quicksand-600.ttf
          weight: 600
        - asset: assets/fonts/Quicksand-700.ttf
          weight: 700
